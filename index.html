<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карьера Футболиста</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Красивый фон без картинок */
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white; min-height: 100vh; display: flex; flex-direction: column;
            padding: 10px; overflow-x: hidden;
        }

        /* Панель навыков */
        .stats-panel { background: rgba(30, 30, 30, 0.9); border: 1px solid #444; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
        .stats-title { font-size: 14px; color: #f1c40f; margin-bottom: 8px; text-transform: uppercase; text-align: center; font-weight: bold;}
        .stat-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px;}
        .stat-val { font-weight: bold; color: #fff; }
        .stat-desc { font-size: 10px; color: #888; margin-bottom: 6px;}

        /* Окно истории */
        .story-box { 
            background: rgba(20, 20, 20, 0.95); border: 1px solid #333; border-radius: 15px; 
            padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; 
            animation: fadeIn 0.4s; box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .story-title { font-size: 22px; color: #3498db; margin-bottom: 5px; text-align: center; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
        .story-meta { font-size: 14px; color: #f1c40f; text-align: center; margin-bottom: 15px; font-weight: bold; background: rgba(241, 196, 15, 0.1); padding: 5px; border-radius: 5px;}
        
        /* Текстовые карточки вместо картинок */
        .event-card { 
            background: rgba(255, 255, 255, 0.05); border-left: 4px solid #3498db; 
            padding: 15px; border-radius: 0 10px 10px 0; margin-bottom: 15px; font-style: italic; color: #ccc;
            font-size: 14px;
        }
        
        .story-text { font-size: 16px; line-height: 1.5; margin-bottom: 15px; color: #eee; }

        /* Кнопки */
        .buttons-container { display: flex; flex-direction: column; gap: 10px; }
        .btn { 
            background: linear-gradient(90deg, #2c3e50, #1a252f); color: white; border: 1px solid #3498db; 
            padding: 15px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; 
            text-align: left; display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); background: #34495e; }
        .btn-chance { font-size: 12px; color: #f1c40f; font-weight: normal; }
        .hidden { display: none !important; }
        
        /* Меню сложности */
        .menu-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center;}
        .menu-btn { padding: 18px; width: 90%; margin: 10px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold;}
        .hard-btn { background: #c0392b; color: white; border: 2px solid #e74c3c; }
        .easy-btn { background: #27ae60; color: white; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

    <!-- МЕНЮ ВЫБОРА СЛОЖНОСТИ -->
    <div id="menu-screen" class="menu-screen">
        <h1 style="color: #f1c40f; margin-bottom: 10px;">Карьера Футболиста</h1>
        <p style="color: #aaa; margin-bottom: 30px;">Пройди путь от двора в Гатчине до вершины мирового футбола.</p>
        <button class="menu-btn hard-btn" onclick="startGame('hard')">🔥 ХАРД (Реализм)</button>
        <button class="menu-btn easy-btn" onclick="startGame('easy')">🌱 ЛЕГКО (Для отдыха)</button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="game-ui" class="hidden" style="display: flex; flex-direction: column; height: 100vh;">
        
        <!-- Панель навыков -->
        <div class="stats-panel">
            <div class="stats-title">📊 Твои навыки</div>
            <div class="stat-row"><span>⚡ Скорость:</span> <span class="stat-val" id="s-speed">15</span></div>
            <div class="stat-desc">Уход от защитников</div>
            <div class="stat-row"><span>🎯 Удар:</span> <span class="stat-val" id="s-shot">10</span></div>
            <div class="stat-desc">Точность и сила удара</div>
            <div class="stat-row"><span>🕺 Дриблинг:</span> <span class="stat-val" id="s-dribble">15</span></div>
            <div class="stat-desc">Обыгрыш 1 на 1</div>
            <div class="stat-row"><span>🔋 Усталость:</span> <span class="stat-val" id="s-fatigue" style="color:#e74c3c;">0%</span></div>
            <div class="stat-desc">Свыше 80% — риск травмы</div>
        </div>

        <!-- Окно истории -->
        <div class="story-box" id="story-box">
            <div class="story-title" id="st-title">Возраст: 12 лет</div>
            <div class="story-meta" id="st-meta">Клуб: Двор (Гатчина)</div>
            
            <div class="event-card" id="st-event">Событие</div>
            
            <div class="story-text" id="st-text">Текст</div>
            <div class="buttons-container" id="buttons-area">
                <!-- Кнопки -->
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let difficulty = "hard";
        let stats = { speed: 15, shot: 10, dribble: 15, fatigue: 0 };
        let age = 12;
        let currentClub = "Двор (Гатчина)";

        function startGame(diff) {
            difficulty = diff;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            updateUI();
            renderYear12();
        }

        function updateUI() {
            document.getElementById('s-speed').innerText = stats.speed;
            document.getElementById('s-shot').innerText = stats.shot;
            document.getElementById('s-dribble').innerText = stats.dribble;
            document.getElementById('s-fatigue').innerText = stats.fatigue + '%';
            document.getElementById('st-title').innerText = `Возраст: ${age} лет`;
            document.getElementById('st-meta').innerText = `Клуб: ${currentClub}`;
            
            if (stats.fatigue >= 100) {
                triggerInjury();
            }
        }

        function renderScene(title, eventText, storyText, buttons) {
            document.getElementById('st-title').innerText = `Возраст: ${age} лет`;
            document.getElementById('st-meta').innerText = `Клуб: ${currentClub}`;
            document.getElementById('st-event').innerText = eventText;
            document.getElementById('st-text').innerText = storyText;
            
            const btnArea = document.getElementById('buttons-area');
            btnArea.innerHTML = ''; 

            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerHTML = `${btn.text} <span class="btn-chance">${btn.hint || ''}</span>`;
                b.onclick = btn.action;
                btnArea.appendChild(b);
            });
        }

        function calculateChance(statValue, baseDifficulty) {
            let chance = (statValue / 2) + baseDifficulty;
            if (difficulty === "hard") chance -= 10;
            return Math.min(95, Math.max(10, Math.floor(chance))); 
        }

        // === ГОД 12 ===
        function renderYear12() {
            let btns = [
                { text: "Пахать на тренировках", hint: "Удар +2, Усталость +10", action: () => {
                    stats.shot += 2; stats.fatigue += 10; updateUI(); age = 13; renderYear13();
                }},
                { text: "Гулять с пацанами", hint: "Скорость +1, Усталость 0", action: () => {
                    stats.speed += 1; stats.fatigue = 0; updateUI(); age = 13; renderYear13();
                }}
            ];
            renderScene("12 лет", "Двор в Гатчине", "Ты гоняешь мяч на бетоне. Тренер ДЮСШ заметил тебя и предложил прийти на просмотр. До 13 лет нужно выбрать, как провести время.", btns);
        }

        // === ГОД 13 ===
        function renderYear13() {
            let btns = [
                { text: "Пойти на просмотр в ДЮСШ", hint: "Шанс зависит от Скорости", action: () => {
                    let chance = calculateChance(stats.speed, 50);
                    if (Math.random() * 100 <= chance) {
                        currentClub = "ДЮСШ Ленинградец";
                        stats.fatigue += 10;
                        updateUI(); age = 14; renderYear14(true);
                    } else {
                        updateUI(); age = 14; renderYear14(false);
                    }
                }},
                { text: "Забить на футбол и пойти в подвал", hint: "Конец карьеры", action: () => {
                    alert("Ты выбрал улицу. Карьера футболиста закончилась, не начавшись. Нажми F5, чтобы попробовать снова.");
                }}
            ];
            renderScene("13 лет", "Просмотр", "Тренер смотрит на твою игру. Он ищет быстрых и выносливых. Твой шанс попасть в команду зависит от твоей скорости.", btns);
        }

        // === ГОД 14 ===
        function renderYear14(success) {
            let text = success ? "Ты в ДЮСШ! Начинаются настоящие тренировки." : "Ты не прошел. Придется год пахать самому, чтобы тебя заметили.";
            let btns = [
                { text: "Тренировать Удар", hint: "Удар +5", action: () => {
                    stats.shot += 5; stats.fatigue += 15; updateUI(); age = 15; renderYear15();
                }},
                { text: "Тренировать Дриблинг", hint: "Дриблинг +5", action: () => {
                    stats.dribble += 5; stats.fatigue += 15; updateUI(); age = 15; renderYear15();
                }}
            ];
            renderScene("14 лет", "Тренировки", text, btns);
        }

        // === ГОД 15 (Матч со скаутами) ===
        function renderYear15() {
            let chanceRight = calculateChance(stats.shot, 55);
            let chanceDribble = calculateChance(stats.dribble, 45);
            
            let btns = [
                { text: "Пробить в правую девятку", hint: `Шанс ${chanceRight}%`, action: () => {
                    if (Math.random() * 100 <= chanceRight) {
                        stats.shot += 5; currentClub = "Академия Зенита";
                        updateUI(); age = 16; renderYear16(true);
                    } else {
                        currentClub = "Ленинградец";
                        updateUI(); age = 16; renderYear16(false);
                    }
                }},
                { text: "Обыграть вратаря", hint: `Шанс ${chanceDribble}%`, action: () => {
                    if (Math.random() * 100 <= chanceDribble) {
                        stats.dribble += 5; currentClub = "Академия Зенита";
                        updateUI(); age = 16; renderYear16(true);
                    } else {
                        currentClub = "Ленинградец";
                        updateUI(); age = 16; renderYear16(false);
                    }
                }}
            ];
            renderScene("15 лет", "Матч ЮФЛ", "Скауты «Зенита» на трибунах. Выход 1 на 1. Как пробьешь?", btns);
        }

        // === ГОД 16 ===
        function renderYear16(success) {
            let text = success ? "Ты забил! Тебя забрали в Академию Зенита." : "Ты не забил. Остался в Ленинградце, но тренер обещал дать шанс.";
            let btns = [];
            
            if (currentClub === "Академия Зенита") {
                btns.push({ text: "Остаться в дубле Зенита", hint: "Мало игр", action: () => {
                    stats.fatigue += 20; updateUI(); age = 17; renderYear17("zenit");
                }});
                btns.push({ text: "Уехать в Португалию (2 див.)", hint: "Игровая практика", action: () => {
                    currentClub = "Португалия (2 див.)"; stats.speed += 5; updateUI(); age = 17; renderYear17("portugal");
                }});
            } else {
                btns.push({ text: "Играть за Ленинградец", action: () => {
                    stats.fatigue += 15; updateUI(); age = 17; renderYear17("russia");
                }});
            }
            renderScene("16 лет", "Выбор пути", text, btns);
        }

        // === ГОД 17 ===
        function renderYear17(path) {
            let text = "";
            if (path === "zenit") text = "Ты в дубле Зенита. Здесь тяжело, тренер тебя не замечает. Нужно пахать.";
            if (path === "portugal") text = "Ты в Португалии. Здесь жесткий футбол, но ты получаешь игровые минуты.";
            if (path === "russia") text = "Ты в основе Ленинградца. Ты лидер, но команда слабая.";

            let btns = [
                { text: "Тренировать Скорость (Бег)", hint: "Скорость +5, Усталость +30", action: () => {
                    stats.speed += 5; stats.fatigue += 30; checkInjury(18, renderYear18);
                }},
                { text: "Тренировать Удар", hint: "Удар +5, Усталость +30", action: () => {
                    stats.shot += 5; stats.fatigue += 30; checkInjury(18, renderYear18);
                }},
                { text: "Тренировать Дриблинг", hint: "Дриблинг +5, Усталость +30", action: () => {
                    stats.dribble += 5; stats.fatigue += 30; checkInjury(18, renderYear18);
                }}
            ];
            renderScene("17 лет", "Тренировочный лагерь", text, btns);
        }

        function checkInjury(nextAge, nextScene) {
            updateUI();
            if (stats.fatigue > 80 && difficulty === "hard") {
                stats.speed -= 3; stats.shot -= 3; stats.fatigue = 20;
                updateUI();
                age = nextAge;
                renderScene("Травма!", "Из-за перегрузки ты получил травму.", "Тренер дал тебе шанс восстановиться, но ты потерял скорость и удар.", [
                    { text: "Выйти на матч (Стиснув зубы)", action: () => nextScene() }
                ]);
            } else {
                age = nextAge;
                nextScene();
            }
        }

        // === ГОД 18 (Важный матч) ===
        function renderYear18() {
            let chance = calculateChance(stats.shot, 50);
            let btns = [
                { text: "Пробить самому", hint: `Шанс ${chance}%`, action: () => {
                    if (Math.random() * 100 <= chance) {
                        stats.shot += 10; stats.fatigue += 20;
                        renderYear19(true);
                    } else {
                        stats.shot += 2; stats.fatigue += 20;
                        renderYear19(false);
                    }
                }},
                { text: "Отдать пас партнеру", hint: "Надежно", action: () => {
                    stats.dribble += 3; stats.fatigue += 10;
                    renderYear19(true, true);
                }}
            ];
            renderScene("18 лет", "Кубок", "Решающий матч. Скауты из Европы на трибунах. На 90-й минуте пенальти. Твой удар решает всё.", btns);
        }

        // === ГОД 19 (Итог) ===
        function renderYear19(success, assist = false) {
            age = 19;
            let text = "";
            if (success && !assist) {
                currentClub = "Топ-клуб Европы";
                text = "Ты забил! Тебя выкупает клуб из высшего дивизиона Европы.";
            } else if (assist) {
                currentClub = "Клуб Ла Лиги";
                text = "Ты отдал пас, партнер забил. Тебя ценят за ум и приглашают в Испанию.";
            } else {
                currentClub = "РПЛ";
                text = "Ты промазал. Остаешься в России, но играешь в основе.";
            }
            updateUI();
            renderScene("19 лет", "Итог года", text, [
                { text: "Перейти к 20 годам", action: () => {
                    age = 20;
                    renderYear20();
                }}
            ]);
        }

        // === ГОД 20 ===
        function renderYear20() {
            renderScene("20 лет", "Готов к Европе", "Ты на пороге большого футбола. Твои характеристики выросли. Впереди — переход в топ-5 лиг.", [
                { text: "Продолжить карьеру (20-38 лет)", action: () => {
                    alert("Поздравляем! Ты дошел до 20 лет. В следующем коде мы распишем путь до 38 лет (с топ-клубами, старением Мбаппе и твоим финалом). Твои статы сохранены.");
                }}
            ]);
        }

        function triggerInjury() {
            stats.fatigue = 0;
            stats.speed -= 5; stats.shot -= 5;
            updateUI();
            alert("ВНИМАНИЕ! Усталость достигла 100%. Тяжелая травма! Ты потерял часть характеристик.");
        }
    </script>
</body>
</html>
